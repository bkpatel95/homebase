user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;

  log_format access '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'cf-user="$http_cf_access_authenticated_user_email"';

  access_log /var/log/nginx/access.log access;
  error_log  /var/log/nginx/error.log;

  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream fastapi {
    server 127.0.0.1:8096;
  }

  server {
    listen 8095 default_server;
    server_name _;

    root /var/www/daily-bhavi;
    index index.html;

    location /assets/ {
      access_log off;
      expires 30d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /manifest.webmanifest {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    location = /sw.js {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # WebSocket — needs Upgrade/Connection headers + indefinite read timeout
    location = /api/ws {
      proxy_pass http://fastapi;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # SSE chat stream — disable buffering so tokens reach the client live
    location = /api/chat {
      proxy_pass http://fastapi;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
      proxy_read_timeout 5m;
      chunked_transfer_encoding on;
    }

    # Generic /api/* proxy
    location /api/ {
      proxy_pass http://fastapi;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
      proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
