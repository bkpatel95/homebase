[project]
name = "homebase-backend"
version = "0.3.0"
description = "The Daily Bhavi — FastAPI backend for the homebase PWA"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "ruff==0.7.4",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "respx==0.21.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend"]
extend-exclude = [
    ".venv",
    "venv",
    "frontend",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — formatter handles it
    "B008",   # FastAPI uses Depends() in defaults
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["B011"]   # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
