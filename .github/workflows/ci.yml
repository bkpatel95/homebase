name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            pyproject.toml

      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check backend/

      - name: ruff format --check
        run: ruff format --check backend/

      - name: pytest
        run: |
          if [ -d backend/tests ] && [ -n "$(find backend/tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
            pytest backend/tests
          else
            echo "No tests found yet — skipping pytest."
          fi

  frontend:
    name: Frontend (eslint + prettier + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier --check
        run: npm run format:check

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          build-args: |
            BUILD_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
